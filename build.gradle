plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.0-RC'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.github.gonzq'
version = '1.3'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {url 'https://jitpack.io'}
    maven {
        name = "helpchatRepoReleases"
        url = uri("https://repo.helpch.at/releases")
    }

}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'fr.mrmicky:fastboard:2.1.5'
    implementation 'fr.mrmicky:FastInv:3.0.3'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.15'
}

shadowJar {
    relocate 'fr.mrmicky.fastboard', 'com.github.gonzq.uhcmeetup'
    relocate 'fr.mrmicky.fastinv', 'com.github.gonzq.uhcmeetup'
    relocate 'com.zaxxer.hikari', 'com.github.gonzq.uhcmeetup.libs.hikari'
    relocate 'org.jetbrains.kotlin', 'com.github.gonzq.uhcmeetup.libs.kotlin'
}

def targetJavaVersion = 16
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
compileKotlin {
    kotlinOptions {
        jvmTarget = "16"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "16"
    }
}
