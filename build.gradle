plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.github.gonzq'
version = '1.3'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {url 'https://jitpack.io'}
    maven {
        name = "helpchatRepoReleases"
        url = uri("https://repo.helpch.at/releases")
    }

}

dependencies {
    // Paper API: what Leaf/Paper 1.21.11 actually run. The Spigot 1.21.11
    // snapshot on hub.spigotmc.org is a master-branch build whose GameRule
    // API is already renamed, which breaks at runtime on released servers.
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'fr.mrmicky:fastboard:2.1.5'
    implementation 'fr.mrmicky:FastInv:3.0.3'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.15'
}

// Only ship the shaded jar: the plain jar has no Kotlin runtime and fails
// with NoClassDefFoundError when dropped on a server by mistake.
tasks.named('jar') {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    relocate 'fr.mrmicky.fastboard', 'com.github.gonzq.uhcmeetup'
    relocate 'fr.mrmicky.fastinv', 'com.github.gonzq.uhcmeetup'
    relocate 'com.zaxxer.hikari', 'com.github.gonzq.uhcmeetup.libs.hikari'
    relocate 'org.jetbrains.kotlin', 'com.github.gonzq.uhcmeetup.libs.kotlin'
}

// Minecraft 1.21.11 runs on Java 21, so the plugin is built for Java 21.
def targetJavaVersion = 21

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

kotlin {
    jvmToolchain(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
